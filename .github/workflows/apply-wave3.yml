name: Apply Wave 3 Documentation

on:
  push:
    branches:
      - agent/undead-blood-underwater-guides
    paths:
      - scripts/apply_wave3_docs.py
      - scripts/wave3_chunks/**
      - .github/workflows/apply-wave3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/undead-blood-underwater-guides
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply documentation package
        run: python scripts/apply_wave3_docs.py .
      - name: Commit documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs zensical.toml
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "Add Undead, Blood, and Underwater guides"
          git push origin HEAD:agent/undead-blood-underwater-guides
