name: Validate Wiki

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Wiki tooling
        run: python -m unittest discover -s tests -v
      - name: Verify source snapshot
        run: |
          python scripts/audit_sources.py \
            --report build/source-audit.json \
            --github-summary
      - name: Generate data and build site
        run: python scripts/build_wiki.py --offline
      - name: Report patch impact
        run: |
          python scripts/report_patch_impact.py \
            --report build/patch-impact.json \
            --github-summary
      - name: Audit Wiki structure
        run: |
          set +e
          python scripts/audit_wiki.py --report build/wiki-audit.json
          status=$?
          if [ "$status" -ne 0 ]; then
            python scripts/report_wiki_audit.py build/wiki-audit.json --path-prefix docs
          fi
          exit "$status"
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-audits
          path: |
            build/*-audit.json
            build/patch-impact.json
          if-no-files-found: warn
