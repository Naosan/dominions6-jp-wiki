name: Validate Wiki

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Zensical
        run: pip install zensical
      - name: Generate nation pages
        run: python scripts/generate_nation_catalog.py
      - name: Generate recruit, mage, and unit loadout data
        run: python scripts/generate_recruitment_data.py
      - name: Validate recruit equipment references
        run: python scripts/check_recruitment_equipment_refs.py --offline
      - name: Generate equipment usage reverse indexes
        run: python scripts/generate_equipment_usage_data.py --offline
      - name: Generate spell and item data
        run: python scripts/generate_spell_item_data.py
      - name: Generate combat equipment data
        run: python scripts/generate_combat_data.py
      - name: Generate Unit acquisition catalog
        run: python scripts/generate_unit_catalog.py
      - name: Generate Magic Site catalog
        run: python scripts/generate_magic_site_data.py
      - name: Generate Site Search references
        run: python scripts/generate_site_search_data.py --offline
      - name: Generate nation Site Search capability
        run: python scripts/run_nation_site_search_data.py --offline
      - name: Generate extended Magic Access
        run: python scripts/run_extended_magic_access_data.py --offline
      - name: Generate Magic Access routes
        run: python scripts/run_magic_access_routes.py --offline
      - name: Build site
        run: zensical build --clean
