name: Site validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "overrides/**"
      - "zensical.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "site-validation-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Wiki tooling
        run: python -m unittest discover -s tests -v
      - name: Generate, build, and audit the site
        run: python scripts/build_wiki.py --offline
      - name: Audit Wiki structure
        run: |
          set +e
          python scripts/audit_wiki.py --report build/wiki-audit.json
          status=$?
          if [ "$status" -ne 0 ]; then
            python scripts/report_wiki_audit.py build/wiki-audit.json --path-prefix docs
          fi
          exit "$status"
